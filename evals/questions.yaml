# The eval set. Each answerable question names where the answer lives:
# a file and either a section heading (resolved to its line range by
# src/lib/evals.ts) or an explicit line range. A retrieved passage counts
# as a hit when it comes from that file and overlaps those lines.
#
# Questions marked `answerable: false` are about things the corpus does
# not cover; the right behaviour is to say so, not to guess.

